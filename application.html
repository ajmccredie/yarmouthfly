<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application | Trapeze School</title>
    <meta
      name="description"
      content="Apply for training and development with the trapeze school."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=BenchNine:wght@700&family=Alumni+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/trapeze.css" />
  </head>
  <body class="bg-radiate">
    <div class="theatre-seats" aria-hidden="true"></div>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="images/stc_logo.png" alt="Steal This Circus Trapeze School" class="brand-logo" />
          <span class="brand-text">Trapeze School</span>
        </a>

        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="site-nav" id="site-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="heritage.html">Heritage</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="classes.html">Classes</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="application.html">Apply</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="container">
        <div class="stage-panel panel-centered">
          <h1>Application Form</h1>
          <p>
            Use this form for deeper training, development opportunities, or programme applications.
          </p>

          <form
            action="https://formspree.io/f/YOUR_APPLICATION_FORM_ID"
            method="post"
            data-formspree-form
            data-success-message="Thank you — your application has been submitted."
            data-button-text="Submit Application"
          >
            <input type="hidden" name="_subject" value="Trapeze School Application Form" />

            <p>
              <label for="app-name">Full name</label>
              <input type="text" id="app-name" name="full_name" required />
            </p>

            <p>
              <label for="app-email">Email</label>
              <input type="email" id="app-email" name="email" required />
            </p>

            <p>
              <label for="app-phone">Phone</label>
              <input type="tel" id="app-phone" name="phone" />
            </p>

            <p>
              <label for="app-location">Location</label>
              <input type="text" id="app-location" name="location" />
            </p>

            <p>
              <label for="app-age">Age bracket</label>
              <select id="app-age" name="age_bracket">
                <option value="">Please choose</option>
                <option value="18-24">18–24</option>
                <option value="25-34">25–34</option>
                <option value="35-44">35–44</option>
                <option value="45+">45+</option>
              </select>
            </p>

            <p>
              <label for="app-experience">Previous experience</label>
              <textarea id="app-experience" name="previous_experience" rows="5"></textarea>
            </p>

            <p>
              <label for="app-goals">Goals / motivation</label>
              <textarea id="app-goals" name="goals_motivation" rows="5" required></textarea>
            </p>

            <p>
              <label for="app-availability">Availability</label>
              <textarea id="app-availability" name="availability" rows="4"></textarea>
            </p>

            <p>
              <label for="app-medical">Medical / access notes</label>
              <textarea id="app-medical" name="medical_access_notes" rows="4"></textarea>
            </p>

            <p>
              <label for="app-emergency">Emergency contact</label>
              <input type="text" id="app-emergency" name="emergency_contact" />
            </p>

            <p>
              <label>
                <input type="checkbox" name="consent" required />
                I confirm the information provided is correct and consent to being contacted about this application.
              </label>
            </p>

            <p>
              <button type="submit" class="btn">Submit Application</button>
            </p>
          </form>

          <p class="form-status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <img src="images/stc_logo.png" alt="" class="brand-logo" />
          <span>Steal This Circus Trapeze School</span>
        </div>
        <p>&copy; <span id="year"></span> Steal This Circus</p>
      </div>
    </footer>

    <script src="js/trapeze.js"></script>
  </body>
</html>
