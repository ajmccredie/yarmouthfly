<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Trapeze School</title>
    <meta
      name="description"
      content="Contact the trapeze school."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=BenchNine:wght@700&family=Alumni+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/trapeze.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="images/stc-trapeze-logo.png" alt="Steal This Circus Trapeze School" class="brand-logo" />
          <span class="brand-text">Trapeze School</span>
        </a>

        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="site-nav" id="site-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="heritage.html">Heritage</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="classes.html">Classes</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="application.html">Apply</a></li>
            <li><a href="../index.html">Main Site</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <section class="container">
        <div class="stage-panel panel-centered">
          <h1>Contact</h1>
          <p>
            Ask about classes, private sessions, accessibility, group bookings, or anything else.
          </p>

          <form
            action="https://formspree.io/f/YOUR_CONTACT_FORM_ID"
            method="post"
            data-formspree-form
            data-success-message="Thanks — your message has been sent."
            data-button-text="Send Message"
          >
            <input type="hidden" name="_subject" value="Trapeze School Contact Form" />

            <p>
              <label for="contact-name">Name</label>
              <input type="text" id="contact-name" name="name" required />
            </p>

            <p>
              <label for="contact-email">Email</label>
              <input type="email" id="contact-email" name="email" required />
            </p>

            <p>
              <label for="contact-subject">Subject</label>
              <select id="contact-subject" name="subject" required>
                <option value="">Please choose</option>
                <option value="General enquiry">General enquiry</option>
                <option value="Booking enquiry">Booking enquiry</option>
                <option value="Private session">Private session</option>
                <option value="Accessibility question">Accessibility question</option>
              </select>
            </p>

            <p>
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" rows="7" required></textarea>
            </p>

            <p>
              <label>
                <input type="checkbox" name="consent" required />
                I consent to being contacted in response to this enquiry.
              </label>
            </p>

            <p>
              <button type="submit" class="btn">Send Message</button>
            </p>
          </form>

          <p class="form-status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <img src="images/stc-trapeze-logo.png" alt="" class="brand-logo" />
          <span>Steal This Circus Trapeze School</span>
        </div>
        <p>&copy; <span id="year"></span> Steal This Circus</p>
      </div>
    </footer>

    <script src="js/trapeze.js"></script>
  </body>
</html>
